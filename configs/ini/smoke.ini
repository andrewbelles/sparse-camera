# smoke.ini  default configuration for the smoke test
#
# One [sink] section, then one [cam.<label>] section per camera. The label is
# used only for logging; id is the camera_id carried on the wire and must be
# unique. Unknown keys and malformed values are startup errors, not warnings.

[sink]
endpoint  = ipc:///tmp/frames.sock
frames    = 100        ; per camera; 0 runs until SIGINT
tol       = 0.5        ; cadence tolerance, fraction of the expected period
timeout_s = 60         ; watchdog; 0 disables
verbose   = true

[cam.mock0]
backend = mock
enabled = true
id      = 0
fps     = 30
grid    = 64x64        ; output geometry, ROWSxCOLS
sites   = 256          ; sites emitted per frame

# Disabled so the default run needs no hardware. Set enabled to true to fan a
# webcam in alongside the mock.
#
# fps has a different meaning per backend. The mock paces itself by it. A real
# camera is paced by its driver, so here fps only states what the sink should
# expect, and 0 disables the cadence check. Set it once the device's actual
# rate is known; a wrong value counts every frame as jitter.
[cam.video0]
backend    = v4l2
enabled    = true 
id         = 1
fps        = 0
device     = /dev/video0
resolution = 480x640   ; capture size, HEIGHTxWIDTH
grid       = 64x64     ; downsample to this many cells, ROWSxCOLS
threshold  = 32        ; luminance strictly above this is a site
buffers    = 4         ; mmap buffers, >= 2
timeout_ms = 2000      ; per-frame poll timeout
