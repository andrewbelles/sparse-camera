# memtest.ini  configuration for the valgrind run
#
# Short run and a wide tolerance: valgrind's slowdown makes the mock miss
# pacing deadlines, and this run is looking for memory errors, not cadence.

[sink]
endpoint  = ipc:///tmp/frames-memtest.sock
frames    = 20
tol       = 0.95
timeout_s = 300
verbose   = false

[cam.mock0]
backend = mock
enabled = true
id      = 0
fps     = 10
grid    = 64x64
sites   = 256

[cam.video0]
backend    = v4l2
enabled    = true 
id         = 1
fps        = 0
device     = /dev/video0
resolution = 480x640
grid       = 64x64
threshold  = 32
buffers    = 4
timeout_ms = 10000
