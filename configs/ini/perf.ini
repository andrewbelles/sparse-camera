# perf.ini  configuration for the profiling run
#
# The rate and geometry are well above the smoke defaults on purpose: at 30 fps
# with 256 sites the process sits in clock_nanosleep and profiles as idle.
# Frames drop once the send queue fills, which does not affect the profile.
#
# frames is bounded by the slowest enabled camera, and the profiler makes two
# passes over the run. A hardware camera delivering ~14 fps therefore costs
# 2 * frames / 14 seconds of wall time.

[sink]
endpoint  = ipc:///tmp/frames-perf.sock
frames    = 300
tol       = 0.95
timeout_s = 300
verbose   = false

[cam.mock0]
backend = mock
enabled = true
id      = 0
fps     = 500
grid    = 256x256
sites   = 32768

[cam.video0]
backend    = v4l2
enabled    = false  
id         = 1
fps        = 0
device     = /dev/video0
resolution = 480x640
grid       = 64x64
threshold  = 32
buffers    = 4
timeout_ms = 2000
